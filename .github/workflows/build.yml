name: Build whisper.cpp Vulkan (Windows)
# NVIDIA 그래픽카드가 없는 Windows(LG gram 같은 Intel·AMD 내장 그래픽)용 받아쓰기 도구 (사용자 지정 2026-10-30).
# 공식 배포 파일에는 Vulkan판이 없어 개발 앱·Mac과 같은 1.9.4 소스로 직접 빌드한다. 결과 zip은 Release(v1.9.4-vulkan)에 올린다 — 받는 쪽이 확인값(sha256)으로 검사한다
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
env:
  WHISPER_VERSION: '1.9.4'
  WHISPER_SHA256: '57e280cee375ab02425b806ad5146b99f6eb9357e3c2b31357c8a6af2e2e44ae'
  VULKAN_VERSION: '1.4.309.0'
jobs:
  vulkan:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Vulkan SDK
        shell: pwsh
        run: |
          curl.exe -fL --retry 3 -o "$env:RUNNER_TEMP\vulkan.exe" "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe"
          & "$env:RUNNER_TEMP\vulkan.exe" --accept-licenses --default-answer --confirm-command install | Out-Null
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\$env:VULKAN_VERSION"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\$env:VULKAN_VERSION\bin"
      - name: whisper.cpp source
        shell: pwsh
        run: |
          curl.exe -fL --retry 3 -o whisper.tar.gz "https://codeload.github.com/ggml-org/whisper.cpp/tar.gz/refs/tags/v$env:WHISPER_VERSION"
          $sha = (Get-FileHash whisper.tar.gz -Algorithm SHA256).Hash.ToLower()
          if ($sha -ne $env:WHISPER_SHA256) { throw "checksum $sha" }
          tar -xzf whisper.tar.gz
          Rename-Item "whisper.cpp-$env:WHISPER_VERSION" src
      - name: Build
        shell: pwsh
        working-directory: src
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGGML_VULKAN=ON -DGGML_NATIVE=OFF -DBUILD_SHARED_LIBS=OFF -DWHISPER_BUILD_TESTS=OFF -DWHISPER_SDL2=OFF
          cmake --build build --config Release --target whisper-cli whisper-server -j 4
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          Copy-Item src\build\bin\Release\whisper-cli.exe, src\build\bin\Release\whisper-server.exe out\
          Get-ChildItem src\build\bin\Release\*.dll -ErrorAction SilentlyContinue | Copy-Item -Destination out\
          Copy-Item src\LICENSE out\whisper-cpp-LICENSE.txt
          & out\whisper-cli.exe --help | Select-Object -First 3
          Compress-Archive -Path out\* -DestinationPath "whisper-$env:WHISPER_VERSION-vulkan-win-x64.zip"
          (Get-FileHash "whisper-$env:WHISPER_VERSION-vulkan-win-x64.zip" -Algorithm SHA256).Hash.ToLower() | Tee-Object sha256.txt
          Get-ChildItem out | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: whisper-vulkan-win-x64
          path: |
            whisper-*-vulkan-win-x64.zip
            sha256.txt
          retention-days: 30
      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:WHISPER_VERSION-vulkan"
          gh release delete $tag -y --cleanup-tag 2>$null
          gh release create $tag "whisper-$env:WHISPER_VERSION-vulkan-win-x64.zip" sha256.txt --title "whisper.cpp $env:WHISPER_VERSION Vulkan (Windows x64)" --notes "Unmodified whisper.cpp v$env:WHISPER_VERSION built with -DGGML_VULKAN=ON (whisper-cli, whisper-server). License: MIT (whisper-cpp-LICENSE.txt)." --repo $env:GITHUB_REPOSITORY
