name: Build whisper.cpp CUDA (Windows, GTX 16xx 포함)
# NVIDIA 그래픽카드 Windows용 받아쓰기 도구 — 공식 배포판은 텐서 코어가 없는 GTX 16 시리즈에서 "suboptimal performance" 경고와 함께
# 받아쓰기 한 번에 3.5초 걸렸다(사용자 GTX 1660 Ti). 경고가 권하는 대로 Pascal/Turing 경로(MMQ)를 넣어 같은 1.9.4 소스로 빌드한다
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cuda.yml']
  workflow_dispatch:
permissions:
  contents: write
env:
  WHISPER_VERSION: '1.9.4'
  WHISPER_SHA256: '57e280cee375ab02425b806ad5146b99f6eb9357e3c2b31357c8a6af2e2e44ae'
jobs:
  cuda:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: Jimver/cuda-toolkit@v0.2.24
        id: cuda
        with:
          cuda: '11.8.0'
          method: network
          sub-packages: '["nvcc","cudart","cublas","cublas_dev","visual_studio_integration"]'
      - name: whisper.cpp source
        shell: pwsh
        run: |
          curl.exe -fL --retry 3 -o whisper.tar.gz "https://codeload.github.com/ggml-org/whisper.cpp/tar.gz/refs/tags/v$env:WHISPER_VERSION"
          $sha = (Get-FileHash whisper.tar.gz -Algorithm SHA256).Hash.ToLower()
          if ($sha -ne $env:WHISPER_SHA256) { throw "checksum $sha" }
          tar -xzf whisper.tar.gz
          Rename-Item "whisper.cpp-$env:WHISPER_VERSION" src
      - name: Build
        shell: pwsh
        working-directory: src
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGGML_CUDA=ON -DGGML_CUDA_FORCE_MMQ=ON "-DCMAKE_CUDA_ARCHITECTURES=61-virtual;75-real;80-virtual" "-DCMAKE_CUDA_FLAGS=-allow-unsupported-compiler -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH" -DGGML_NATIVE=OFF -DBUILD_SHARED_LIBS=OFF -DWHISPER_BUILD_TESTS=OFF -DWHISPER_SDL2=OFF
          cmake --build build --config Release --target whisper-cli whisper-server -j 4
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          Copy-Item src\build\bin\Release\whisper-cli.exe, src\build\bin\Release\whisper-server.exe out\
          Get-ChildItem src\build\bin\Release\*.dll -ErrorAction SilentlyContinue | Copy-Item -Destination out\
          Copy-Item "$env:CUDA_PATH\bin\cudart64_110.dll" out\
          Copy-Item src\LICENSE out\whisper-cpp-LICENSE.txt
          Compress-Archive -Path out\* -DestinationPath "whisper-$env:WHISPER_VERSION-cuda-mmq-win-x64.zip"
          (Get-FileHash "whisper-$env:WHISPER_VERSION-cuda-mmq-win-x64.zip" -Algorithm SHA256).Hash.ToLower() | Tee-Object sha256-cuda.txt
          Get-ChildItem out | Format-Table Name, Length
      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:WHISPER_VERSION-cuda-mmq"
          gh release delete $tag -y --cleanup-tag 2>$null
          gh release create $tag "whisper-$env:WHISPER_VERSION-cuda-mmq-win-x64.zip" sha256-cuda.txt --title "whisper.cpp $env:WHISPER_VERSION CUDA (MMQ, Pascal/Turing/Ampere)" --notes "Unmodified whisper.cpp v$env:WHISPER_VERSION built with -DGGML_CUDA=ON -DGGML_CUDA_FORCE_MMQ=ON, CUDA 11.8, archs 61-virtual;75-real;80-virtual. License: MIT." --repo $env:GITHUB_REPOSITORY
